<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>グレートTV | 総合エンタメテレビ局</title><style>
:root{font-family:'Arial','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;color:#fff;background:#1a0025}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#9e0077 0,#360046 45%,#15001e 100%);min-height:100vh}header{position:sticky;top:0;z-index:5;background:#230021ed;border-bottom:3px solid #ff4bca;box-shadow:0 0 18px #ff4bca}nav{max-width:1200px;margin:auto;display:flex;align-items:center;gap:10px;padding:10px 14px;overflow-x:auto}nav button{border:0;background:transparent;color:white;font-weight:900;white-space:nowrap;padding:10px 8px;cursor:pointer;border-radius:12px}nav button.active,nav button:hover{background:linear-gradient(110deg,#ff149d,#8b00e7);box-shadow:0 0 10px #ff4dce}.brand{font-size:22px;font-weight:1000;color:#fff300;text-shadow:2px 2px #f50098;white-space:nowrap;margin-right:10px}.wrap{max-width:1160px;margin:auto;padding:14px}.hero{position:relative;border:5px solid #ff51c7;border-radius:20px;overflow:hidden;box-shadow:0 0 22px #ff00bd;background:#b9008d}.hero img{width:100%;display:block;max-height:510px;object-fit:cover;object-position:center}.hero-label{position:absolute;bottom:0;left:0;right:0;text-align:center;padding:12px;background:linear-gradient(transparent,#4c0049ee);font-weight:1000;font-size:clamp(15px,3vw,27px);text-shadow:2px 3px #b5005e}.section{margin:20px 0;border:3px solid #ff54ce;background:#39003aee;border-radius:18px;padding:16px;box-shadow:0 0 14px #d800a0}.section h2{margin:0 0 15px;font-size:clamp(20px,3vw,28px);color:#fff;text-shadow:2px 2px #ff0088}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px}.show{border:3px solid #ff76dd;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,#d6008d,#5700a5);box-shadow:0 0 9px #ff45be;cursor:pointer;color:white;text-align:left;padding:0;transition:transform .15s}.show:hover{transform:translateY(-3px)}.thumb{height:120px;display:flex;align-items:center;justify-content:center;font-size:58px;background:radial-gradient(circle,#ff8fe3,#ae0088 65%,#3b0067)}.show strong{display:block;padding:12px;font-size:17px;text-shadow:1px 2px #50002c}.show small{display:block;padding:0 12px 12px;color:#ffe4f6}.chips{display:flex;gap:9px;flex-wrap:wrap}.chip{border:2px solid #fff;border-radius:30px;padding:8px 14px;color:#fff;background:linear-gradient(90deg,#ff009e,#9200e9);font-weight:bold;cursor:pointer}.chip.selected{background:#ffcc00;color:#4a0040}.schedule{display:grid;gap:8px}.schedule div{padding:12px;background:#690052;border-left:5px solid #ffd000;border-radius:8px}.schedule b{color:#ffe000;margin-right:15px}.btn{background:linear-gradient(100deg,#ff0b9e,#a100df);border:2px solid white;border-radius:30px;color:white;font-weight:bold;padding:10px 18px;cursor:pointer}.hidden{display:none!important}footer{text-align:center;padding:25px;color:#ffd9f2}.notice{font-size:13px;color:#ffe0f3}.back{margin-bottom:12px}.detail{padding:20px;background:#63005c;border-radius:14px}input{font-size:16px;padding:12px;border-radius:10px;border:2px solid #ff74da;width:100%;max-width:400px;background:#fff;color:#222}@media(max-width:550px){nav{gap:3px}.brand{font-size:18px}.wrap{padding:9px}.section{padding:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.thumb{height:95px;font-size:45px}.show strong{font-size:14px;padding:8px}.show small{font-size:12px;padding:0 8px 10px}}
</style></head><body><header><nav id="nav"><span class="brand">★ GREAT TV</span><button data-page="home" class="active">🏠 ホーム</button><button data-page="schedule">番組表</button><button data-page="programs">番組一覧</button><button data-page="news">ニュース</button><button data-page="announcers">アナウンサー</button><button data-page="stream">動画配信</button><button data-page="events">イベント</button><button data-page="about">会社概要</button></nav></header><main class="wrap"><div id="home"><div class="hero"><img src="hero.png" alt="グレートTV 総合エンタメのメインビジュアル"><div class="hero-label">テレビをもっと楽しく！もっとワクワク！</div></div><section class="section"><h2>⭐ GREAT TV 人気番組</h2><div class="grid" id="featured"></div></section><section class="section"><h2>📺 今夜の番組表（サンプル）</h2><div class="schedule" id="today"></div><p><button class="btn" data-go="schedule">番組表をもっと見る →</button></p></section><section class="section"><h2>✨ 番組ジャンル</h2><div class="chips" id="genres"></div></section></div><div id="other" class="hidden"></div></main><footer>★ GREAT TV ★<p class="notice">このサイトは提供画像をもとに作成した試作品です。番組・日時・配信内容はサンプルです。</p></footer><script>
const shows=[['💖','ドッキリTV','バラエティ','ドッキリ満載のバラエティ番組'],['🤣','バカ笑い！ふざけ王決定戦','お笑い','笑いの王者を目指す！'],['🎙️','深夜のトーク','トーク','深夜のトークバラエティ'],['🎮','ゲーム実況ナイト','アニメ・ゲーム','ゲームを楽しむ実況番組'],['🎭','グレートドッキリ大作戦','バラエティ','サプライズ満載の番組'],['🍓','アイドル！わくわくグルメ','アイドル','アイドルとグルメを楽しもう'],['🌸','アニメ＆ゲーム エロ楽特集','アニメ・ゲーム','アニメとゲームの特集'],['🎤','グレートアイドル生放送SP','アイドル','アイドルのスペシャル番組'],['🎉','おバカ！体当たりバラエティ','お笑い','元気いっぱいのバラエティ'],['♨️','感じる♡温泉ロケ','旅・温泉','温泉を巡る旅番組']];
const slots=[['月','21:00','ドラマスペシャル'],['火','22:00','ふざけすぎトーク（生放送）'],['水','20:00','グレートドッキリ大作戦'],['木','21:00','深夜のトーク'],['金','19:00','アイドル生放送SP']];
let current='home';const $=s=>document.querySelector(s);const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function card(s,i){return `<button class="show" data-show="${i}"><div class="thumb">${s[0]}</div><strong>${escapeHtml(s[1])}</strong><small>${escapeHtml(s[2])}</small></button>`}function schedule(){return slots.map(s=>`<div><b>${s[0]} ${s[1]}</b>${escapeHtml(s[2])}</div>`).join('')}
function attach(){document.querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>detail(+b.dataset.show));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>page(b.dataset.go));document.querySelectorAll('[data-genre]').forEach(b=>b.onclick=()=>page('programs',b.dataset.genre))}
function detail(i){const s=shows[i];$('#home').classList.add('hidden');$('#other').classList.remove('hidden');$('#other').innerHTML=`<button class="btn back" id="return">← 番組一覧へ</button><section class="section detail"><div style="font-size:75px">${s[0]}</div><h2>${escapeHtml(s[1])}</h2><p>ジャンル：${escapeHtml(s[2])}</p><p>${escapeHtml(s[3])}</p><p class="notice">※ この番組紹介は試作品用の内容です。</p></section>`;$('#return').onclick=()=>page('programs');window.scrollTo(0,0)}
function page(name,genre='すべて'){current=name;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===name));$('#home').classList.toggle('hidden',name!=='home');$('#other').classList.toggle('hidden',name==='home');let html='';if(name==='schedule')html=`<section class="section"><h2>📺 北海道・釧路のテレビ局</h2><p>民放テレビ局を一覧で確認できます。</p><div class="grid">${[['HBC北海道放送','TBS系列'],['STV札幌テレビ','日本テレビ系列'],['HTB北海道テレビ','テレビ朝日系列'],['UHB北海道文化放送','フジテレビ系列'],['TVhテレビ北海道','テレビ東京系列'],['⭐ GREAT TV','オリジナル番組']].map(s=>`<div class="show" style="padding:18px;text-align:left"><strong>${s[0]}</strong><p>${s[1]}</p></div>`).join('')}</div><p class="notice">※ NHKは掲載していません。実際の放送番組・時刻は自動取得していません。</p></section><section class="section"><h2>🗾 全国の民放系列</h2><p>日本テレビ系列・TBS系列・フジテレビ系列・テレビ朝日系列・テレビ東京系列・独立局</p><p class="notice">地域ごとの局と実際の番組表は順次整備予定です。</p></section><section class="section"><h2>⭐ グレートTV オリジナル番組表（サンプル）</h2><div class="schedule">${schedule()}</div></section>`;if(name==='programs'){let gs=['すべて',...new Set(shows.map(s=>s[2]))];html=`<section class="section"><h2>📺 番組一覧</h2><div class="chips">${gs.map(g=>`<button class="chip ${g===genre?'selected':''}" data-genre="${g}">${g}</button>`).join('')}</div><br><div class="grid">${shows.map((s,i)=>s[2]===genre||genre==='すべて'?card(s,i):'').join('')}</div></section>`}if(name==='news')html='<section class="section"><h2>📰 ニュース</h2><p>グレートTVの最新情報はここに掲載予定！</p><p class="notice">ニュースの投稿機能は今後追加できます。</p></section>';if(name==='announcers')html='<section class="section"><h2>🎤 アナウンサー</h2><p>出演者・アナウンサーのプロフィールを掲載するページです。</p></section>';if(name==='stream')html='<section class="section"><h2>▶ 動画配信</h2><p>動画を追加すると、ここから再生できるようになります。</p><p class="notice">現在は動画未登録です。</p></section>';if(name==='events')html='<section class="section"><h2>🎪 イベント</h2><p>イベント情報は準備中です。</p></section>';if(name==='about')html='<section class="section"><h2>🏢 会社概要</h2><p>グレートTV — 総合エンタメテレビ局（サイト試作品）</p><p>このページに運営者情報やお問い合わせ先を追加できます。</p></section>';if(name!=='home')$('#other').innerHTML=html;attach();window.scrollTo(0,0)}
$('#featured').innerHTML=shows.slice(0,10).map(card).join('');$('#today').innerHTML=schedule();$('#genres').innerHTML=['ドラマ','バラエティ','お笑い','トーク','アイドル','アニメ・ゲーム','グルメ','旅・温泉'].map(g=>`<button class="chip" data-genre="${g}">${g}</button>`).join('');document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>page(b.dataset.page));attach();
</script></body></html>
